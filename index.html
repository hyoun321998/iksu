<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IKSU — Kick News &amp; Drama</title>
  <meta name="description" content="The internet's premier source for Kick news, drama, and discourse. All content is satire." />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="logo.png" />
  <style>

    /* ── TICKER ── */
    .ticker-bar {
      background: var(--green);
      color: #000;
      height: 34px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    .ticker-label {
      font-family: 'Oswald', sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: #000;
      color: var(--green);
      padding: 0 0.85rem;
      height: 100%;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .ticker-track {
      flex: 1;
      overflow: hidden;
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
    }
    .ticker-content {
      display: inline-block;
      white-space: nowrap;
      font-family: 'Oswald', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #000;
      animation: ticker-scroll 30s linear infinite;
      padding-left: 100%;
    }
    @keyframes ticker-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    .ticker-sep {
      margin: 0 1.5rem;
      opacity: 0.4;
    }

    /* ── FEATURED SECTION ── */
    .feature-section {
      padding: 3.5rem 1.5rem 4rem;
      position: relative;
      overflow: hidden;
      min-height: 420px;
      display: flex;
      align-items: center;
    }
    .feature-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 65% 80% at 0% 50%, rgba(83,252,24,0.06) 0%, transparent 65%),
        radial-gradient(ellipse 40% 40% at 100% 20%, rgba(83,252,24,0.03) 0%, transparent 60%);
      pointer-events: none;
    }
    .feature-inner {
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      position: relative;
    }

    /* ── FEATURED CARD ── */
    .featured-card {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 3rem;
      align-items: center;
      cursor: pointer;
    }
    @media (max-width: 860px) {
      .featured-card { grid-template-columns: 1fr; gap: 1.5rem; }
      .featured-sidebar { display: none; }
    }

    .featured-eyebrow {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .featured-badge {
      font-family: 'Oswald', sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.2rem 0.6rem;
      border-radius: 2px;
    }
    .badge-breaking  { background: #c0392b; color: #fff; }
    .badge-live      { background: var(--green); color: #000; }
    .badge-exclusive { background: #8e44ad; color: #fff; }
    .badge-analysis  { background: #2980b9; color: #fff; }
    .badge-opinion   { background: #d35400; color: #fff; }
    .badge-live::before { content: '● '; animation: blink 1s step-start infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .featured-category {
      font-family: 'Oswald', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green);
    }
    .featured-time {
      font-size: 0.7rem;
      color: var(--text-muted);
      opacity: 0.5;
    }

    .featured-headline {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(1.8rem, 3.5vw, 3rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      line-height: 1.15;
      color: var(--text);
      margin-bottom: 1.25rem;
      border-left: 4px solid var(--green);
      padding-left: 1.25rem;
    }

    .featured-excerpt {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.8;
      margin-bottom: 1.5rem;
      max-width: 600px;
      padding-left: 1.25rem;
      border-left: 4px solid transparent;
    }

    .featured-footer {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      padding-left: 1.25rem;
    }
    .featured-byline {
      font-size: 0.8rem;
      color: var(--text-muted);
      opacity: 0.55;
    }
    .featured-byline span { color: var(--green); opacity: 1; }

    .read-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'Oswald', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--green);
      background: rgba(83,252,24,0.08);
      border: 1px solid rgba(83,252,24,0.25);
      border-radius: 4px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      text-decoration: none;
    }
    .read-btn:hover { background: rgba(83,252,24,0.15); border-color: rgba(83,252,24,0.5); }

    /* sidebar preview cards */
    .featured-sidebar {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .sidebar-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1rem 1.1rem;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
    }
    .sidebar-card:hover { border-color: rgba(83,252,24,0.35); transform: translateX(2px); }
    .sidebar-card-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }
    .sidebar-badge {
      font-family: 'Oswald', sans-serif;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.1rem 0.4rem;
      border-radius: 2px;
    }
    .sidebar-time {
      font-size: 0.68rem;
      color: var(--text-muted);
      opacity: 0.45;
      margin-left: auto;
    }
    .sidebar-headline {
      font-family: 'Oswald', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1.3;
      color: var(--text);
    }

    /* ── DIVIDER ── */
    .section-divider {
      height: 1px;
      background: var(--border);
    }

    /* ── RECENT SECTION ── */
    .recent-section {
      padding: 3rem 1.5rem 5rem;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
    }
    .recent-inner { max-width: 1100px; margin: 0 auto; }

    .recent-header {
      display: flex;
      align-items: baseline;
      gap: 0.85rem;
      margin-bottom: 2rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--border);
    }
    .recent-header h2 {
      font-family: 'Oswald', sans-serif;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--text-muted);
    }
    .recent-tag {
      font-family: 'Oswald', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: var(--green);
      color: #000;
      padding: 0.18rem 0.55rem;
      border-radius: 2px;
      font-weight: 700;
    }
    .recent-note {
      margin-left: auto;
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0.45;
      font-style: italic;
    }

    .recent-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }
    @media (max-width: 820px) { .recent-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 540px) { .recent-grid { grid-template-columns: 1fr; } }

    /* ── GRID CARD ── */
    .grid-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.35rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      transition: border-color 0.2s, transform 0.2s;
    }
    .grid-card:hover { border-color: rgba(83,252,24,0.35); transform: translateY(-2px); }

    .grid-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .grid-badge {
      font-family: 'Oswald', sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      padding: 0.13rem 0.5rem;
      border-radius: 2px;
    }
    .grid-category {
      font-family: 'Oswald', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--green);
    }
    .grid-time {
      font-size: 0.68rem;
      color: var(--text-muted);
      opacity: 0.5;
      margin-left: auto;
    }
    .grid-headline {
      font-family: 'Oswald', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1.25;
      color: var(--text);
    }
    .grid-byline {
      font-size: 0.7rem;
      color: var(--text-muted);
      opacity: 0.45;
      margin-top: auto;
      padding-top: 0.45rem;
      border-top: 1px solid var(--border);
    }
    .grid-byline span { color: var(--green); opacity: 1; }

    /* ── EMPTY STATE ── */
    .empty-feature {
      text-align: center;
      padding: 5rem 1.5rem;
      color: var(--text-muted);
    }
    .empty-feature img {
      width: 72px;
      opacity: 0.15;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 0 12px rgba(83,252,24,0.2));
    }
    .empty-feature h2 {
      font-family: 'Oswald', sans-serif;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .empty-feature p { font-size: 0.85rem; opacity: 0.5; }

    /* ── FOOTER ── */
    .cs-footer-bar {
      background: #050505;
      border-top: 1px solid var(--border);
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .cs-footer-bar-inner {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }
    .cs-footer-bar img { width: 44px; opacity: 0.5; }
    .cs-footer-bar p { font-size: 0.78rem; color: var(--text-muted); opacity: 0.45; }

    /* ── NAV LINKS ── */
    .nav-right-links {
      display: flex;
      align-items: center;
      gap: 1.75rem;
    }
    .nav-right-links a {
      font-family: 'Oswald', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-right-links a:hover,
    .nav-right-links a.active { color: var(--green); }

    /* ── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 500;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem 4rem;
      overflow-y: auto;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.open { display: flex; animation: fadeIn 0.18s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-panel {
      background: var(--bg);
      border: 1px solid var(--border);
      border-top: 3px solid var(--green);
      border-radius: 8px;
      width: 100%;
      max-width: 740px;
      position: relative;
      animation: slideUp 0.2s ease;
    }
    @keyframes slideUp { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }

    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 32px; height: 32px;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.2s, border-color 0.2s;
      z-index: 10;
    }
    .modal-close:hover { color: var(--text); border-color: var(--green); }

    .modal-header {
      padding: 2rem 2rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .modal-eyebrow {
      display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
      margin-bottom: 0.85rem;
    }
    .modal-headline {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(1.3rem, 3vw, 2rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1.2;
      color: var(--text);
      margin-bottom: 0.85rem;
    }
    .modal-byline {
      font-size: 0.78rem;
      color: var(--text-muted);
      opacity: 0.5;
    }
    .modal-byline span { color: var(--green); opacity: 1; }
    .modal-time-text { opacity: 0.45; font-size: 0.72rem; }

    .modal-body {
      padding: 1.75rem 2rem 2rem;
      display: flex; flex-direction: column; gap: 1.5rem;
    }
    .body-text {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.8;
    }
    .body-tweet { display: flex; justify-content: center; }
    .body-kick {
      border-radius: 6px; overflow: hidden;
      background: #000; aspect-ratio: 16/9;
    }
    .body-kick iframe { width: 100%; height: 100%; border: none; display: block; }
    .modal-satire-note {
      font-size: 0.72rem; color: var(--text-muted); opacity: 0.35;
      text-align: center; font-style: italic;
      border-top: 1px solid var(--border); padding-top: 1.25rem;
    }

    @media (max-width: 600px) {
      .modal-header { padding: 1.5rem 1.25rem 1.25rem; }
      .modal-body   { padding: 1.25rem; }
    }

  </style>
</head>
<body>

<!-- Nav -->
<nav>
  <a class="nav-brand" href="index.html">
    <img src="logo.png" alt="IKSU Logo" />
    <span>IKSU</span>
  </a>
  <div class="nav-right-links">
    <a href="index.html" class="active">Home</a>
    <a href="archive.html">Archive</a>
  </div>
</nav>

<!-- Breaking news ticker -->
<div class="ticker-bar" id="ticker-bar" style="display:none;">
  <span class="ticker-label">Breaking</span>
  <div class="ticker-track">
    <div class="ticker-content" id="ticker-content"></div>
  </div>
</div>

<!-- Featured story -->
<section class="feature-section">
  <div class="feature-inner">
    <div id="featured-area">
      <!-- rendered by JS -->
    </div>
  </div>
</section>

<!-- Recent stories -->
<section class="recent-section" id="recent-section" style="display:none;">
  <div class="recent-inner">
    <div class="recent-header">
      <h2>Latest Coverage</h2>
      <span class="recent-tag">IKSU</span>
      <span class="recent-note">All content is satire</span>
    </div>
    <div class="recent-grid" id="recent-grid"></div>
  </div>
</section>

<!-- Footer -->
<div class="cs-footer-bar">
  <div class="cs-footer-bar-inner">
    <img src="logo.png" alt="IKSU" />
    <p>International Kick Streamers Union &mdash; Not affiliated with Kick.com &mdash; All content is satire</p>
  </div>
</div>

<!-- Full-post modal -->
<div id="modal-overlay" class="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal-panel">
    <button class="modal-close" onclick="closeModal()" title="Close">✕</button>
    <div class="modal-header" id="modal-header"></div>
    <div class="modal-body"   id="modal-body"></div>
  </div>
</div>

<script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>

<script>

  let allPosts = [];

  /* ── HELPERS ── */
  function esc(str) {
    return String(str ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function relTime(ts) {
    const d = Date.now() - ts;
    const m = Math.floor(d/60000), h = Math.floor(d/3600000), dy = Math.floor(d/86400000);
    if (m  <  1) return 'Just now';
    if (m  < 60) return `${m}m ago`;
    if (h  < 24) return `${h}h ago`;
    if (dy <  7) return `${dy}d ago`;
    return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  }

  function badgeCls(b) {
    return {breaking:'badge-breaking',live:'badge-live',exclusive:'badge-exclusive',analysis:'badge-analysis',opinion:'badge-opinion'}[b]||'badge-breaking';
  }

  function firstExcerpt(post, max=200) {
    const tb = (post.blocks||[]).find(b=>b.type==='text');
    if (!tb||!tb.content) return '';
    const t = tb.content.trim();
    return t.length>max ? t.slice(0,max).trimEnd()+'…' : t;
  }

  /* ── TICKER ── */
  function renderTicker(posts) {
    if (!posts.length) return;
    const content = posts
      .map(p => `<span>${esc(p.title)}</span><span class="ticker-sep">◆</span>`)
      .join('');
    document.getElementById('ticker-content').innerHTML = content + content; // double for seamless loop
    document.getElementById('ticker-bar').style.display = 'flex';
  }

  /* ── FEATURED ── */
  function renderFeatured(posts) {
    const area = document.getElementById('featured-area');

    if (!posts.length) {
      area.innerHTML = `
        <div class="empty-feature">
          <h2>No stories published yet</h2>
          <p>Our reporters are tirelessly covering the drama. Check back soon.</p>
        </div>`;
      return;
    }

    const main = posts[0];
    const ex   = firstExcerpt(main);
    const side = posts.slice(1, 4);

    const sideHTML = side.map(p => `
      <div class="sidebar-card" onclick="openModal('${p.id}')">
        <div class="sidebar-card-meta">
          <span class="sidebar-badge ${badgeCls(p.badge)}">${esc(p.badge)}</span>
          <span style="font-family:'Oswald',sans-serif;font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--green);">${esc(p.category)}</span>
          <span class="sidebar-time">${relTime(p.timestamp)}</span>
        </div>
        <div class="sidebar-headline">${esc(p.title)}</div>
      </div>
    `).join('');

    area.innerHTML = `
      <div class="featured-card" onclick="openModal('${main.id}')">
        <div>
          <div class="featured-eyebrow">
            <span class="featured-badge ${badgeCls(main.badge)}">${esc(main.badge)}</span>
            <span class="featured-category">${esc(main.category)}</span>
            <span class="featured-time">${relTime(main.timestamp)}</span>
          </div>
          <h2 class="featured-headline">${esc(main.title)}</h2>
          ${ex ? `<p class="featured-excerpt">${esc(ex)}</p>` : ''}
          <div class="featured-footer">
            <span class="featured-byline">By <span>${esc(main.byline||'IKSU Staff')}</span> &mdash; IKSU</span>
            <span class="read-btn">Read Full Story →</span>
          </div>
        </div>
        ${side.length ? `<div class="featured-sidebar" onclick="event.stopPropagation()">${sideHTML}</div>` : ''}
      </div>`;
  }

  /* ── RECENT GRID ── */
  function renderRecent(posts) {
    const recent = posts.slice(4, 10);
    if (!recent.length) return;

    document.getElementById('recent-section').style.display = 'block';
    document.getElementById('recent-grid').innerHTML = recent.map(p => `
      <article class="grid-card" onclick="openModal('${p.id}')">
        <div class="grid-meta">
          <span class="grid-badge ${badgeCls(p.badge)}">${esc(p.badge)}</span>
          <span class="grid-category">${esc(p.category)}</span>
          <span class="grid-time">${relTime(p.timestamp)}</span>
        </div>
        <h3 class="grid-headline">${esc(p.title)}</h3>
        <div class="grid-byline">By <span>${esc(p.byline||'IKSU Staff')}</span> &mdash; IKSU</div>
      </article>
    `).join('');
  }

  /* ── MODAL ── */
  function openModal(id) {
    const post = allPosts.find(p => p.id === id);
    if (!post) return;

    document.getElementById('modal-header').innerHTML = `
      <div class="modal-eyebrow">
        <span class="featured-badge ${badgeCls(post.badge)}">${esc(post.badge)}</span>
        <span style="font-family:'Oswald',sans-serif;font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--green);">${esc(post.category)}</span>
        <span class="modal-time-text">${relTime(post.timestamp)}</span>
      </div>
      <h2 class="modal-headline">${esc(post.title)}</h2>
      <div class="modal-byline">By <span>${esc(post.byline||'IKSU Staff')}</span> &mdash; IKSU Newsroom</div>
    `;

    const bodyEl = document.getElementById('modal-body');
    const blocks = post.blocks || [];

    if (!blocks.length) {
      bodyEl.innerHTML = '<p class="body-text" style="opacity:0.4;font-style:italic;">No content available.</p>';
    } else {
      bodyEl.innerHTML = blocks.map(block => {
        if (block.type === 'text') {
          return (block.content||'').split(/\n\n+/).filter(p=>p.trim())
            .map(p=>`<p class="body-text">${esc(p.trim()).replace(/\n/g,'<br>')}</p>`).join('');
        }
        if (block.type === 'tweet' && block.tweetId) {
          return `<div class="body-tweet"><blockquote class="twitter-tweet" data-theme="dark"><a href="${esc(block.tweetUrl)}"></a></blockquote></div>`;
        }
        if (block.type === 'kick' && block.clipSlug) {
          return `<div class="body-kick"><iframe src="https://kick.com/video/${esc(block.clipSlug)}?nochat=1" allowfullscreen allow="autoplay; encrypted-media"></iframe></div>`;
        }
        return '';
      }).join('');
    }

    bodyEl.insertAdjacentHTML('beforeend', `<p class="modal-satire-note">All IKSU content is satire — for entertainment purposes only. Not affiliated with Kick.com.</p>`);

    if (window.twttr && window.twttr.widgets) window.twttr.widgets.load(bodyEl);

    document.getElementById('modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  /* ── LOAD ── */
  async function init() {
    try {
      const res = await fetch('posts.json?v=' + Date.now());
      if (!res.ok) throw new Error();
      allPosts = await res.json();
    } catch { allPosts = []; }

    const published = allPosts.filter(p => p.published);
    const featured  = published.filter(p => p.featured !== false);
    renderTicker(published);
    renderFeatured(featured);
    renderRecent(featured);
  }

  init();

</script>
</body>
</html>
